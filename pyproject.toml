[project]
name = "lawyer-mcp"
version = "0.1.0"
description = "법원 경매/사건검색 MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "mcp[cli]>=1.2.0",
  "playwright>=1.44.0",
  "pydantic>=2.6.0",
]

[project.scripts]
lawyer-mcp = "lawyer_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lawyer_mcp"]
